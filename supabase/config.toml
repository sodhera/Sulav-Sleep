# Supabase CLI project config. Generated to hold Edge Function settings for
# SleepBlock. Extend with `supabase init` output if you need local dev, DB
# migrations, etc. — only the pieces the app relies on are pinned here.

project_id = "sleepblock"

# The account-deletion function must run only for a signed-in caller, so JWT
# verification stays ON (the default). The function additionally re-checks the
# token via getUser() before deleting. See functions/delete-account/index.ts.
[functions.delete-account]
verify_jwt = true

# Referral redemption runs as the signed-in caller, same pattern.
[functions.redeem-referral]
verify_jwt = true

# RevenueCat's server is not a Supabase user, so JWT verification is OFF
# here; the function authenticates the caller against the shared
# REVENUECAT_WEBHOOK_TOKEN secret instead (the dashboard sends it in the
# Authorization header). See functions/revenuecat-webhook/index.ts.
[functions.revenuecat-webhook]
verify_jwt = false
